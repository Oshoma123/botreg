[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botreg"
version = "0.1.0"
description = "Unified programmatic access to the US public regulatory and label record for dietary supplements, and the Botanical Adulteration Event Record derived from it"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Oshoma Erumiseli", email = "Erumiseli.oshomag@gmail.com"}]
keywords = ["dietary supplements", "botanical adulteration", "openFDA", "DSLD",
            "Proposition 65", "GBIF", "regulatory data", "pharmacovigilance"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/Oshoma123/botreg"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
